<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Druid agentic engineering loop</title>
  <desc id="desc">Issue scanner, risk classifier, decision engine, runtime, PR generator, CI tracker, adaptive memory, and strategy update loop.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f4eadf"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#c86f55"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6b4a36" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="#faf6ef"/>
  <path d="M0 424 C176 376 270 450 438 398 C652 334 764 178 948 232 C1032 256 1072 302 1120 314 L1120 520 L0 520 Z" fill="#eadbc9" opacity="0.7"/>
  <g font-family="Styrene A, Styrene B, Anthropic Sans, Helvetica Neue, Arial, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="760" fill="#2f2a24" filter="url(#shadow)">
    <g transform="translate(48 78)">
      <rect width="214" height="74" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="31">Issue / Bounty</text><text x="24" y="56">Scanner</text>
    </g>
    <g transform="translate(316 78)">
      <rect width="214" height="74" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="31">Risk &amp; Value</text><text x="24" y="56">Classifier</text>
    </g>
    <g transform="translate(584 78)">
      <rect width="214" height="74" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="45">Decision Engine</text>
    </g>
    <g transform="translate(852 78)">
      <rect width="214" height="74" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="31">Druid Agent</text><text x="24" y="56">Runtime</text>
    </g>
    <g transform="translate(852 250)">
      <rect width="214" height="82" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="34">Patch / Test /</text><text x="24" y="61">PR Generator</text>
    </g>
    <g transform="translate(584 250)">
      <rect width="214" height="82" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="34">CI / Review</text><text x="24" y="61">Tracker</text>
    </g>
    <g transform="translate(316 250)">
      <rect width="214" height="82" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="34">Adaptive</text><text x="24" y="61">Experience Base</text>
    </g>
    <g transform="translate(48 250)">
      <rect width="214" height="82" rx="18" fill="url(#paper)" stroke="#ded1c3"/>
      <text x="24" y="34">Strategy Update</text><text x="24" y="61">/ Stop-loss</text>
    </g>
  </g>
  <g fill="none" stroke="#c86f55" stroke-width="3" marker-end="url(#arrow)">
    <path d="M262 115h50"/>
    <path d="M530 115h50"/>
    <path d="M798 115h50"/>
    <path d="M959 153v91"/>
    <path d="M852 291h-50"/>
    <path d="M584 291h-50"/>
    <path d="M316 291h-50"/>
    <path d="M155 250v-91"/>
  </g>
  <g font-family="Tiempos Text, Tiempos, Iowan Old Style, Georgia, Cambria, Times New Roman, serif" font-size="15" fill="#6f665c">
    <text x="584" y="390">High-risk decisions remain human-gated.</text>
    <text x="584" y="418">Merged, closed, superseded, rewarded, dirty, and stale work becomes memory.</text>
  </g>
</svg>
