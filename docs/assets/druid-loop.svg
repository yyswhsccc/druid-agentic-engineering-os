<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Druid agentic engineering loop</title>
  <desc id="desc">Issue scanner, risk classifier, decision engine, runtime, PR generator, CI tracker, adaptive memory, and strategy update loop.</desc>
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142535"/>
      <stop offset="1" stop-color="#0b151e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#5ee7ff"/>
    </marker>
  </defs>
  <rect width="1120" height="520" rx="20" fill="#071016"/>
  <g stroke="#223446" opacity="0.55">
    <path d="M60 86h1000M60 178h1000M60 270h1000M60 362h1000M60 454h1000"/>
    <path d="M120 42v436M260 42v436M400 42v436M540 42v436M680 42v436M820 42v436M960 42v436"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="760" fill="#edf7ff">
    <g transform="translate(50 80)">
      <rect width="210" height="70" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="30">Issue / Bounty</text><text x="24" y="54">Scanner</text>
    </g>
    <g transform="translate(320 80)">
      <rect width="210" height="70" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="30">Risk &amp; Value</text><text x="24" y="54">Classifier</text>
    </g>
    <g transform="translate(590 80)">
      <rect width="210" height="70" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="42">Decision Engine</text>
    </g>
    <g transform="translate(860 80)">
      <rect width="210" height="70" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="30">Druid Agent</text><text x="24" y="54">Runtime</text>
    </g>
    <g transform="translate(860 250)">
      <rect width="210" height="78" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="31">Patch / Test /</text><text x="24" y="57">PR Generator</text>
    </g>
    <g transform="translate(590 250)">
      <rect width="210" height="78" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="31">CI / Review</text><text x="24" y="57">Tracker</text>
    </g>
    <g transform="translate(320 250)">
      <rect width="210" height="78" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="31">Adaptive</text><text x="24" y="57">Experience Base</text>
    </g>
    <g transform="translate(50 250)">
      <rect width="210" height="78" rx="12" fill="url(#node)" stroke="#31506a"/>
      <text x="24" y="31">Strategy Update</text><text x="24" y="57">/ Stop-loss</text>
    </g>
  </g>
  <g fill="none" stroke="#5ee7ff" stroke-width="3" marker-end="url(#arrow)">
    <path d="M260 115h56"/>
    <path d="M530 115h56"/>
    <path d="M800 115h56"/>
    <path d="M965 150v94"/>
    <path d="M860 289h-56"/>
    <path d="M590 289h-56"/>
    <path d="M320 289h-56"/>
    <path d="M155 250v-94"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#a9bac9">
    <text x="602" y="390">High-risk decisions remain human-gated.</text>
    <text x="602" y="418">Merged, closed, superseded, rewarded, dirty, and stale work becomes memory.</text>
  </g>
</svg>

