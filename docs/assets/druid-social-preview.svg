<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Druid: Agentic Engineering OS</title>
  <desc id="desc">Warm minimal social preview for Yongshan Yu's Druid project.</desc>
  <defs>
